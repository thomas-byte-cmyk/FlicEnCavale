# Publication automatique du jeu sur GitHub Pages.
# À chaque envoi (push) sur la branche main, GitHub :
#   1. récupère le code,
#   2. installe les dépendances, lance les tests automatiques (npm test)
#      et compile le jeu (npm run build) — si un test échoue, rien n'est publié,
#   3. met en ligne le dossier "dist" sur GitHub Pages.
name: Publier sur GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # permet aussi de relancer à la main depuis l'onglet Actions

permissions:
  contents: read
  pages: write
  id-token: write

# Une seule publication à la fois ; la plus récente gagne.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
