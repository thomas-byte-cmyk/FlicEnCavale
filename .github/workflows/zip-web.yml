# Fabrique le zip du jeu pour itch.io, Newgrounds et Game Jolt.
# Ne se lance qu'à la main : onglet Actions → « Zip web (itch.io, Newgrounds) »
# → bouton « Run workflow ».
# Résultat : en bas de la page de l'exécution, rubrique « Artifacts », un
# téléchargement FlicEnCavale-web. GitHub l'emballe toujours dans un zip, que
# beaucoup de navigateurs (Safari…) ouvrent tout seuls : on met donc DEDANS le
# vrai FlicEnCavale-web.zip (index.html à la racine), prêt à envoyer sur ces sites
# (voir docs/PUBLIER-ITCH-NEWGROUNDS.md).
name: Zip web (itch.io, Newgrounds)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # Construit le jeu puis fabrique FlicEnCavale-web.zip (index.html à la racine)
      - run: npm run zip:web
      - uses: actions/upload-artifact@v4
        with:
          name: FlicEnCavale-web
          path: FlicEnCavale-web.zip
          retention-days: 30
